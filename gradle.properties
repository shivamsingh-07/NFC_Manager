# 4g heaps can push total RSS high enough that the OS OOM-kills the Gradle
# daemon during heavy AGP work (strip symbols + dex + kapt), which surfaces
# as "daemon disappeared unexpectedly". 2g + capped workers is stable on
# typical 8–16 GB dev machines while staying faster than --no-daemon.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official
kotlin.incremental=true

ksp.incremental=true
